[package]
name = "lain-kernel"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "lain-kernel"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.6.8", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy = "0.15"
reqwest = { version = "0.13.2", features = ["json", "stream"] }
dirs = "6.0.0"
chrono = { version = "0.4.44", features = ["serde"] }
regex = "1.12.3"
thiserror = "2.0"
tokio-util = { version = "0.7", features = ["rt"] }
async-stream = "0.3"
async-trait = "0.1"
futures-util = "0.3"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
toml = "1.1.4"
sha2 = "0.11.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.23"
tower = "0.5"
