[package]
name = "lain-kernel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "laind"
path = "src/main.rs"

# Protocol fixture only. Release/deployment commands select --bin laind.
[[bin]]
name = "lain-test-app-server"
path = "tests/support/app_server.rs"
test = false
doc = false

[dependencies]
anyhow = "1"
axum = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
regex = "1"
url = "2"
zeroize = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

